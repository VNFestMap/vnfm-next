root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server.exe ./cmd/server"
entrypoint = ["./tmp/server.exe"]
include_ext = ["go", "env"]
exclude_dir = ["tmp", "vendor", "testdata", "build", "node_modules"]
exclude_regex = ["_test.go"]
delay = 1000
log = "build-errors.log"
stop_on_error = false
